name: TVboxOSC Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Production runs are serialized so a second merge cannot interrupt a release.
concurrency:
  group: tvboxosc-${{ github.event_name == 'pull_request' && github.ref || github.repository }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 34
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release automation
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build Debug and run unit tests
        run: |
          chmod +x gradlew
          mkdir -p build
          set -o pipefail
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee build/gradle-build.log
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TVboxOSC-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TVboxOSC-build-reports
          path: |
            build/gradle-build.log
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14

  plan-release:
    if: github.repository == 'kukuqi666/TVboxOSC' && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Plan version change or repair metadata
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py plan

  publish-release:
    needs: [build-apk, plan-release]
    if: needs.plan-release.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 34
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore fixed release signing key
        env:
          TVBOX_KEYSTORE_BASE64: ${{ secrets.TVBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TVBOX_KEYSTORE_BASE64" ]; then
            echo '::error::Configure TVBOX_KEYSTORE_BASE64 with the fixed production signing key.'
            exit 1
          fi
          printf '%s' "$TVBOX_KEYSTORE_BASE64" | base64 --decode > TVBoxOSC.jks
          chmod 600 TVBoxOSC.jks
      - name: Build signed Release APK
        env:
          TVBOX_KEY_ALIAS: ${{ secrets.TVBOX_KEY_ALIAS }}
          TVBOX_KEY_PASSWORD: ${{ secrets.TVBOX_KEY_PASSWORD }}
          TVBOX_STORE_PASSWORD: ${{ secrets.TVBOX_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
      - name: Verify APK and generate update manifest
        env:
          VERSION: ${{ needs.plan-release.outputs.version }}
        run: |
          python scripts/release.py metadata \
            --apk "app/build/outputs/apk/release/TVboxOSC-v${VERSION}.apk" \
            --output build/release/update.json \
            --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/34.0.0/apksigner"
      - name: Create tag and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan-release.outputs.tag }}
          VERSION: ${{ needs.plan-release.outputs.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "docs/releases/${VERSION}.md" ]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "TVboxOSC ${VERSION}" --draft --notes-file "docs/releases/${VERSION}.md"
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "TVboxOSC ${VERSION}" --draft --generate-notes
            fi
          fi
          gh release upload "$TAG" "app/build/outputs/apk/release/TVboxOSC-v${VERSION}.apk" build/release/update.json --clobber
          gh release edit "$TAG" --draft=false --latest
      - name: Remove signing material
        if: always()
        run: rm -f TVBoxOSC.jks

  sync-metadata:
    needs: [build-apk, plan-release, publish-release]
    if: always() && needs.build-apk.result == 'success' && needs.plan-release.result == 'success' && (needs.publish-release.result == 'success' || needs.plan-release.outputs.mode == 'sync')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync published manifest and README to main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan-release.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern update.json --dir build/published --clobber
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/release.py sync --manifest build/published/update.json
            if git diff --quiet -- update.json README.md; then exit 0; fi
            git add update.json README.md
            git commit -m "chore: sync ${TAG} release metadata [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo '::error::Release is published, but main metadata sync failed. Re-run this workflow to repair it.'
          exit 1
